<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Halcyon Reach</title>
<meta name="description" content="Captain the survey ship of a cheerful interstellar NGO and chart a newly opened galactic sector — with diplomacy, trade and curiosity. No combat.">
<meta name="theme-color" content="#0b0d1e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Halcyon Reach">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d1e'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23c9994a' stroke-width='4'/%3E%3Cpath d='M32 10l4 18 18 4-18 4-4 18-4-18-18-4 18-4z' fill='%23e8b53a'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;width:100%;background:#0b0d1e;overflow:hidden;overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  body{position:fixed;inset:0}
  #game{position:fixed;inset:0;overflow:hidden}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:#f2e3b8;font:600 14px system-ui,sans-serif;letter-spacing:.3em;pointer-events:none;
    background:radial-gradient(ellipse at 50% 40%,#1b1f4a 0%,#0b0d1e 70%)}
  #boot i{display:block;width:46px;height:46px;border-radius:50%;border:3px solid #3a3f6a;border-top-color:#e8b53a;animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){#boot i{animation:none}}
  noscript{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#f2e3b8;font:18px system-ui,sans-serif;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="game"></div>
<div id="boot"><i></i>WARMING UP THE VIEWSCREEN…</div>
<noscript>Halcyon Reach needs JavaScript to warm up the viewscreen.</noscript>
<script type="module" src="/src/main.js"></script>
</body>
</html>
